
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Maple's 99 Nights - Bloomwood Valley V5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#95c9d8;color:#fff;font:13px system-ui,-apple-system,sans-serif}
canvas{display:block}
button,input,select{font:inherit}
button{border:2px solid #ffe9c5;background:#2f7169ed;border-radius:16px;color:white;font-weight:750;padding:9px 12px}
button:active{background:#529b82}
#hud{position:fixed;top:max(env(safe-area-inset-top),9px);left:10px;max-width:64%;background:#173f3bbf;border:2px solid #ffdfac;border-radius:16px;padding:8px 11px;pointer-events:none;backdrop-filter:blur(6px)}
#hud strong{color:#ffe5ad;font-size:12px}
#stats{line-height:1.5;font-size:11px;margin-top:3px}
#toolbar{position:fixed;top:max(env(safe-area-inset-top),9px);right:9px;display:flex;gap:6px}
#toolbar button{width:43px;height:43px;border-radius:50%;padding:0;font-size:20px}
#actions{position:fixed;bottom:calc(162px + env(safe-area-inset-bottom));right:12px;display:flex;gap:8px}
#actions button{min-width:79px}
#toast{position:fixed;bottom:calc(180px + env(safe-area-inset-bottom));left:15%;right:15%;text-align:center;padding:9px 14px;border:1px solid #ffe6b9;background:#18473ddc;border-radius:16px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.stick{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:#285d568a;border:3px solid #ffefd2;touch-action:none}
.stick .nub{position:absolute;top:34px;left:34px;width:52px;height:52px;background:#f9d396;border:3px solid #fff4dc;border-radius:50%;pointer-events:none}
#move{left:15px}
#cameraStick{right:15px}
#cameraStick .nub{background:#a4d4e5}
.stick-label{position:fixed;bottom:calc(148px + env(safe-area-inset-bottom));color:#1d4a41;font-size:11px;font-weight:800}
#moveLabel{left:54px}
#lookLabel{right:45px}
#screen,#intro{position:fixed;inset:0;z-index:10;background:#153d40db;display:none;justify-content:center;align-items:center;padding:20px}
#intro{display:flex;z-index:11}
.panel{width:100%;max-width:420px;max-height:85dvh;overflow:auto;background:linear-gradient(150deg,#337467,#245d58);border:2px solid #ffe3ae;border-radius:23px;padding:20px;text-align:center}
.panel h1,.panel h2{color:#ffe6b0;margin:5px 0 10px}
.panel p{line-height:1.5}
.panel button{margin:4px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:7px 9px;margin:6px 0;background:#1d514c;border-radius:12px}
.entry span{text-align:left}
.panel label{text-align:left;display:block;margin:9px 0}
.panel input,.panel select{width:100%;border:0;border-radius:10px;padding:10px;margin-top:5px}
.hint{font-size:11px;color:#d6e9de}
#fatal{position:fixed;z-index:50;top:25%;left:8%;right:8%;display:none;background:#783d43;border:2px solid white;padding:16px;border-radius:15px}
</style>
</head>
<body>
<div id="hud">
<strong>🍁 MAPLE'S 99 NIGHTS</strong>
<div id="stats">Loading Bloomwood Valley...</div>
</div>
<div id="toolbar">
<button id="characters">🐾</button>
<button id="inventory">🎒</button>
<button id="menu">☰</button>
</div>
<div id="toast"></div>
<div id="actions">
<button id="action">✨ Explore</button>
<button id="sleep">🌙 Rest</button>
</div>
<div class="stick" id="move"><div class="nub"></div></div>
<div class="stick-label" id="moveLabel">MOVE</div>
<div class="stick" id="cameraStick"><div class="nub"></div></div>
<div class="stick-label" id="lookLabel">CAMERA</div>
<div id="intro">
<div class="panel">
<div style="font-size:46px">🍁 🐱 🐶 🌸</div>
<h1>Maple's 99 Nights</h1>
<b>BLOOMWOOD VALLEY · VERSION 5</b>
<p>Meet your neighbors, explore an enchanted 3D village, create new animal friends, find treasures and enjoy 99 peaceful nights.</p>
<p class="hint">Left circle: walk · Right circle: look · Pinch: zoom</p>
<button id="start">▶ Enter Bloomwood Valley</button>
</div>
</div>
<div id="screen">
<div class="panel">
<h2 id="screenTitle"></h2>
<div id="screenBody"></div>
<button id="close">Close</button>
</div>
</div>
<div id="fatal"></div>

<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const $=id=>document.getElementById(id);
const clamp=T.MathUtils.clamp;
let rngState=19431;

function rng(){
rngState=(1664525*rngState+1013904223)>>>0;
return rngState/4294967296;
}
const rand=(a,b)=>a+rng()*(b-a);
const pick=a=>a[Math.floor(rng()*a.length)];

const scene=new T.Scene();
scene.background=new T.Color('#a7dfef');
scene.fog=new T.FogExp2('#a7dfef',.010);

const camera=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,150);
let renderer;

try{
renderer=new T.WebGLRenderer({antialias:true,powerPreference:'default'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.45;
document.body.prepend(renderer.domElement);
}catch(e){
$('fatal').style.display='block';
$('fatal').textContent='3D cannot start: '+e.message;
throw e;
}

const hemi=new T.HemisphereLight('#fff6df','#617d70',2.05);
scene.add(hemi);
const sun=new T.DirectionalLight('#ffe6ba',2.7);
sun.position.set(20,30,15);
scene.add(sun);

const M=(c,r=.82)=>new T.MeshStandardMaterial({color:c,roughness:r});
const mat={
grass:M('#79b96e'),
dirt:M('#d4b18b'),
stone:M('#9da6a5'),
trim:M('#f9ebd1'),
wood:M('#936b49'),
woodDark:M('#67452e'),
leaf:M('#6cac68'),
leafLight:M('#91c783'),
roof:M('#b76f6e'),
dark:M('#282d37'),
cream:M('#fff2df'),
pink:M('#eeb0b6'),
gold:M('#f8d18a'),
water:new T.MeshStandardMaterial({color:'#5faec5',roughness:.23,transparent:true,opacity:.9})
};

const geo={
sphere:new T.SphereGeometry(1,20,14),
cube:new T.BoxGeometry(1,1,1),
cone:new T.ConeGeometry(1,1,10),
cyl:new T.CylinderGeometry(1,1,1,12),
torus:new T.TorusGeometry(1,.12,6,20)
};

function mesh(p,g,m,x,y,z,sx=1,sy=sx,sz=sx){
const o=new T.Mesh(geo[g],m);
o.position.set(x,y,z);
o.scale.set(sx,sy,sz);
p.add(o);
return o;
}
const ball=(p,m,x,y,z,sx,sy=sx,sz=sx)=>mesh(p,'sphere',m,x,y,z,sx,sy,sz);
const box=(p,m,x,y,z,sx,sy,sz)=>mesh(p,'cube',m,x,y,z,sx,sy,sz);
const cone=(p,m,x,y,z,r,h)=>mesh(p,'cone',m,x,y,z,r,h,r);
const pole=(p,m,x,y,z,r,h)=>mesh(p,'cyl',m,x,y,z,r,h,r);

function noiseTexture(type){
const c=document.createElement('canvas');
c.width=c.height=128;
const ctx=c.getContext('2d');
const base=type==='grass'?'#78b46b':type==='path'?'#d9bb8d':'#b77870';
ctx.fillStyle=base;
ctx.fillRect(0,0,128,128);
let s=type.length*737;
function v(){
s=(1664525*s+1013904223)>>>0;
return s/4294967296;
}
for(let i=0;i<600;i++){
ctx.fillStyle=type==='grass'?(v()>.5?'#94c780':'#5ba162'):type==='roof'?(v()>.5?'#d08c7b':'#9e5b58'):(v()>.5?'#e9cda3':'#bca078');
ctx.globalAlpha=.08+v()*.16;
ctx.fillRect(v()*128,v()*128,1+v()*5,1+v()*5);
}
ctx.globalAlpha=1;
if(type==='roof'){
ctx.strokeStyle='#804b49';
ctx.globalAlpha=.18;
for(let y=16;y<128;y+=22){
ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(128,y);ctx.stroke();
}
}
const tex=new T.CanvasTexture(c);
tex.colorSpace=T.SRGBColorSpace;
tex.wrapS=tex.wrapT=T.RepeatWrapping;
tex.repeat.set(type==='grass'?18:3,type==='grass'?18:3);
return tex;
}
mat.grass.map=noiseTexture('grass');
mat.dirt.map=noiseTexture('path');
mat.roof.map=noiseTexture('roof');

box(scene,mat.grass,0,-.32,0,108,.64,108);
box(scene,mat.dirt,0,.012,0,4,.025,56);
box(scene,mat.dirt,0,.014,0,55,.025,4);

for(let i=0;i<85;i++){
const x=rand(-25,25),z=rand(-25,25);
if(Math.abs(x)<2.2||Math.abs(z)<2.2)continue;
const stone=ball(scene,mat.stone,x,.026,z,rand(.12,.28),.03,rand(.1,.24));
stone.rotation.y=rand(0,6);
}

const wind=[];
function tree(x,z,sc=1){
const g=new T.Group(),crown=new T.Group();
g.position.set(x,0,z);
g.scale.setScalar(sc);
pole(g,mat.wood,0,1.65,0,.3,3.3);
g.add(crown);
for(let j=0;j<7;j++){
const a=j*Math.PI*2/7;
ball(crown,j%2?mat.leaf:mat.leafLight,
Math.cos(a)*.78,3.65+(j%3)*.25,
Math.sin(a)*.78,1.15,1.06,1.1);
}
ball(crown,mat.leafLight,0,4.65,0,1.25,1.12,1.18);
scene.add(g);
wind.push([crown,rand(0,6)]);
}
function pine(x,z,sc=1){
const g=new T.Group();
g.position.set(x,0,z);
g.scale.setScalar(sc);
pole(g,mat.wood,0,1.6,0,.25,3.2);
for(let j=0;j<3;j++)
cone(g,j%2?mat.leaf:mat.leafLight,0,2.4+j*.82,0,1.55-j*.22,2.15);
scene.add(g);
}
function rock(x,z,s=.5){
const o=new T.Mesh(new T.DodecahedronGeometry(1,0),mat.stone);
o.position.set(x,s*.36,z);
o.scale.set(s,s*.65,s*.8);
scene.add(o);
}
function flower(x,z,color=mat.pink){
const g=new T.Group();
g.position.set(x,0,z);
pole(g,mat.leaf,0,.23,0,.035,.46);
for(let i=0;i<5;i++){
const a=i*6.28/5;
ball(g,color,Math.cos(a)*.17,.49,Math.sin(a)*.17,.13,.1,.13);
}
ball(g,mat.gold,0,.49,0,.085);
scene.add(g);
}
function fence(x,z){
const g=new T.Group();
g.position.set(x,0,z);
for(const s of [-.68,.68]){
box(g,mat.trim,s,.52,0,.18,1,.16);
cone(g,mat.trim,s,1.08,0,.17,.26);
}
box(g,mat.trim,0,.43,0,1.55,.12,.14);
box(g,mat.trim,0,.76,0,1.55,.12,.14);
scene.add(g);
}

const obstacles=[];
function cottage(x,z,wallColor,roofColor='#c87871'){
const g=new T.Group();
g.position.set(x,0,z);
const wall=M(wallColor),roof=M(roofColor);
box(g,mat.stone,0,.17,0,5.15,.34,4.85);
box(g,wall,0,1.75,0,4.4,3.15,4.15);
const cap=cone(g,roof,0,4.3,0,3.4,2.35);
cap.rotation.y=Math.PI/4;
box(g,mat.woodDark,0,1.15,2.13,1.05,2,.14);
ball(g,mat.gold,.28,1.12,2.24,.07);
for(const s of [-1,1]){
box(g,mat.trim,s*1.32,2.04,2.14,.88,1.02,.14);
box(g,mat.wood,s*1.32,2.05,2.23,.075,1.02,.13);
box(g,mat.wood,s*1.32,2.05,2.23,.88,.075,.13);
box(g,mat.trim,s*1.33,.43,2.12,1.45,.23,.38);
ball(g,mat.leaf,s*2,.53,2.1,.46,.45,.45);
}
box(g,mat.stone,-1.35,4.75,-.5,.55,1.2,.55);
box(g,mat.wood,0,2.9,2.17,1.9,.31,.16);
scene.add(g);
obstacles.push({x,z,r:3.1});
}
cottage(-10,-9,'#e4c7a5');
cottage(10,-9,'#bfd3dc','#a66b85');
cottage(-10,11,'#dbbad1','#b36a82');
cottage(10,11,'#ead6ae','#a97668');

for(let z of [-15,-12,-5,6,14,17])
for(let x of [-5,5])fence(x,z);

for(let i=0;i<112;i++){
const x=rand(-48,48),z=rand(-48,48);
if(Math.abs(x)<18&&Math.abs(z)<20)continue;
i%4===0?pine(x,z,rand(.8,1.3)):tree(x,z,rand(.78,1.25));
}

for(let i=0;i<190;i++){
const x=rand(-35,35),z=rand(-35,35);
if(Math.abs(x)<2.4||Math.abs(z)<2.4)continue;
if(i%7===0)rock(x,z,rand(.18,.48));
else flower(x,z,pick([mat.pink,mat.trim,mat.gold]));
}

const pond=new T.Group();
pond.position.set(-20,.01,9);
ball(pond,mat.water,0,.02,0,5.3,.085,3.6);
for(let i=0;i<27;i++){
const a=i*2*Math.PI/27;
ball(pond,mat.stone,Math.cos(a)*5.2,.14,Math.sin(a)*3.5,.4,.22,.45);
}
scene.add(pond);
obstacles.push({x:-20,z:9,r:4.8});

function lantern(x,z){
const g=new T.Group();
g.position.set(x,0,z);
pole(g,mat.wood,0,1.55,0,.11,3.1);
ball(g,mat.gold,0,3.05,0,.34,.41,.35);
cone(g,mat.roof,0,3.51,0,.48,.47);
scene.add(g);
}
for(const q of [[-4,-8],[4,-8],[-4,8],[4,8],[17,3]])lantern(...q);

function market(){
const g=new T.Group();
g.position.set(17,0,3);
box(g,mat.wood,0,.96,0,4.6,.21,2.5);
for(const x of [-1.9,1.9])
for(const z of [-.9,.9])pole(g,mat.wood,x,2,z,.1,3.8);
box(g,mat.roof,0,3.8,0,5,.2,3);
for(let i=0;i<7;i++)
ball(g,pick([mat.pink,mat.gold,mat.leaf]),(i-3)*.5,1.38,.4,.25,.26,.25);
scene.add(g);
obstacles.push({x:17,z:3,r:2.7});
}
market();

// CHARACTERS
const characters=[],villagers=[];

function character(spec){
const root=new T.Group(),rig=new T.Group();
root.add(rig);
const fur=M(spec.color);
const accent=M(spec.accent||'#f7e3c8');
const outfit=M(spec.outfit||'#b9a1d3');
const eye=M('#252b37');

ball(rig,outfit,0,.96,0,.47,.57,.43);
ball(rig,accent,0,.93,.38,.31,.35,.15);

const legs=[],arms=[];
for(const s of [-1,1]){
const leg=new T.Group();
leg.position.set(s*.29,.51,0);
ball(leg,fur,0,-.19,.16,.22,.3,.23);
rig.add(leg);legs.push(leg);
const arm=new T.Group();
arm.position.set(s*.43,1.15,0);
ball(arm,fur,0,-.16,.17,.18,.3,.19);
rig.add(arm);arms.push(arm);
}
const head=new T.Group();
head.position.y=1.78;
rig.add(head);

const isHuman=spec.kind==='person';
ball(head,isHuman?accent:fur,0,0,0,.67,.61,.55);

if(spec.kind==='cat'){
for(const s of [-1,1]){
const e=cone(head,fur,s*.43,.52,-.03,.28,.56);
e.rotation.z=-s*.22;
cone(head,mat.pink,s*.43,.55,.12,.14,.3);
}
for(const s of [-1,1])
ball(head,accent,s*.21,-.2,.47,.26,.2,.17);
}else if(spec.kind==='dog'){
for(const s of [-1,1]){
const e=ball(head,fur,s*.66,.04,-.08,.22,.42,.2);
e.rotation.z=s*.3;
}
ball(head,accent,0,-.21,.45,.4,.28,.31);
}else if(spec.kind==='bird'){
for(const s of [-1,1]){
const wing=ball(rig,fur,s*.51,1.02,-.06,.23,.32,.31);
wing.rotation.z=s*.2;
}
const beak=cone(head,mat.gold,0,-.13,.57,.19,.33);
beak.rotation.x=Math.PI/2;
}else{
ball(head,fur,0,.42,-.08,.67,.23,.49);
ball(head,fur,0,.3,-.37,.53,.31,.25);
}

for(const s of [-1,1]){
ball(head,mat.trim,s*.245,.08,.46,.195,.245,.095);
ball(head,eye,s*.245,.065,.542,.104,.155,.045);
ball(head,mat.trim,s*.28,.15,.58,.037,.043,.02);
ball(head,mat.pink,s*.45,-.22,.38,.16,.085,.06);
}
if(spec.kind!=='bird')
ball(head,eye,0,-.2,.58,.11,.084,.08);

const tail=new T.Group();
tail.position.set(spec.kind==='cat'?-.46:.46,1,-.41);
rig.add(tail);
const tailMesh=ball(tail,fur,0,0,-.22,.14,.15,.46);
tailMesh.rotation.y=.2;

if(spec.kind==='cat'||spec.kind==='dog'){
const collar=mesh(rig,'torus',mat.gold,0,1.36,.05,.4,.4,.4);
collar.rotation.x=Math.PI/2;
ball(rig,mat.gold,0,1.29,.41,.1);
}else{
box(rig,outfit,0,1.25,-.38,.56,.55,.12);
}

root.position.set(spec.x||0,0,spec.z||0);
root.userData={spec,rig,head,arms,legs,tail};
scene.add(root);
return root;
}

function agent(spec,playable){
const model=character(spec);
return{
model,
home:new T.Vector3(spec.x,0,spec.z),
goal:new T.Vector3(spec.x,0,spec.z),
pause:rand(.4,2),
playable
};
}

const party=[
{name:'Maple',kind:'cat',color:'#e8ac69',accent:'#ffe9cc',outfit:'#d89eb5',x:0,z:2},
{name:'Biscuit',kind:'dog',color:'#d0ac90',accent:'#fff4db',outfit:'#8fc5b6',x:3,z:3},
{name:'Pip',kind:'bird',color:'#8ac5d6',accent:'#f2ebd3',outfit:'#f1c883',x:-2,z:4},
{name:'Robin',kind:'person',color:'#9f795f',accent:'#eec9aa',outfit:'#9db5d9',x:3,z:5}
];

party.forEach(s=>characters.push(agent(s,true)));

const names=['Clover','Poppy','Mochi','Peanut','Sunny','Milo','Wren','Willow','Pebble','Juniper'];
for(let i=0;i<names.length;i++){
const s={
name:names[i],
kind:['cat','dog','bird','person'][i%4],
color:pick(['#dfc19b','#b9a6cb','#a8d2c8','#d5a48a']),
accent:'#f4dfc9',
outfit:pick(['#b7a1d8','#e8b694','#9cbeab']),
x:rand(-16,16),z:rand(-16,16)
};
villagers.push(agent(s,false));
}

const artifactNames=['Cat collar','Dog bed','Birdhouse','Small axe','Rope','Ladder','Flashlight','Moonstone','Star map','Silver bell'];
const treasures=[];
for(let i=0;i<26;i++){
const g=new T.Group();
g.position.set(rand(-31,31),0,rand(-31,31));
ball(g,mat.gold,0,.65,0,.27,.37,.27);
ball(g,mat.trim,0,1.03,0,.13);
scene.add(g);
treasures.push({g,name:artifactNames[i%artifactNames.length],found:false});
}

const seasonNames=['Spring','Summer','Autumn','Winter'];
const timeNames=['Morning','Afternoon','Evening','Night'];
const weatherNames=['Sunny','Rain','Breezy','Snow'];
let selected=0,night=1,time=0,season=0,weather=0;
let wood=0,berries=0,gardens=0,homes=0,inventory=[];
let playing=false,paused=false,music=false;
const saveKey='maples-bloomwood-v5';

function save(){
try{
localStorage.setItem(saveKey,JSON.stringify({
selected,night,time,season,wood,berries,gardens,homes,inventory,extras:party.slice(4)
}));
}catch(e){}
}
function load(){
try{
const s=JSON.parse(localStorage.getItem(saveKey)||'null');
if(!s)return;
night=s.night||1;
time=s.time||0;
season=s.season||0;
wood=s.wood||0;
berries=s.berries||0;
gardens=s.gardens||0;
homes=s.homes||0;
inventory=s.inventory||[];
for(const p of (s.extras||[]).slice(0,8)){
party.push(p);
characters.push(agent({...p,x:p.x||2,z:p.z||2},true));
}
selected=clamp(s.selected||0,0,party.length-1);
for(let i=0;i<Math.min(inventory.length,treasures.length);i++){
treasures[i].found=true;
scene.remove(treasures[i].g);
}
}catch(e){}
}

let toastTimeout;
function toast(s){
$('toast').textContent=s;
$('toast').classList.add('on');
clearTimeout(toastTimeout);
toastTimeout=setTimeout(()=>$('toast').classList.remove('on'),5000);
}

function stats(){
$('stats').textContent=`🌙 ${night}/99 · ${timeNames[time]} · ${seasonNames[season]} · ${weatherNames[weather]} | 🐾 ${party[selected].name} · 🎒 ${inventory.length} · 🪵 ${wood} · 🍓 ${berries} · 🏡 ${homes}`;
}
function ambience(){
const sky=['#b7e4ef','#a7dce8','#e7b88f','#344d78'][time];
scene.background.set(sky);
scene.fog.color.set(sky);
sun.intensity=[2.2,2.65,1.25,.3][time];
hemi.intensity=[2.05,2.1,1.45,.8][time];
mat.grass.color.set(['#7cb977','#72b96d','#c8ab77','#d6e5e5'][season]);
mat.leaf.color.set(['#6cac68','#59a764','#bf9258','#a8c3c5'][season]);
mat.leafLight.color.set(['#91c783','#7abb70','#deb16b','#bfd4d5'][season]);
}
load();ambience();stats();

function switchTo(i){
selected=i;stats();save();toast('🐾 Playing as '+party[i].name);
}
function explore(){
const p=characters[selected].model.position;
let found=null,d=3;
for(const t of treasures){
const r=p.distanceTo(t.g.position);
if(!t.found&&r<d){d=r;found=t}
}
if(found){
found.found=true;
scene.remove(found.g);
inventory.push(found.name);
toast('🎁 Found '+found.name+'!');
}else{
const n=villagers.find(a=>a.model.position.distanceTo(p)<3);
if(n)toast('💬 '+n.model.userData.spec.name+': Let’s explore the village!');
else{wood++;berries++;toast('🌳 Gathered wood and berries!')}
}
stats();save();
}
function plant(){
const p=characters[selected].model.position,g=new T.Group();
g.position.set(p.x+1.5,0,p.z+1);
box(g,mat.wood,0,.1,0,1.5,.2,1.1);
for(let i=-1;i<=1;i++){
cone(g,mat.leaf,i*.36,.48,0,.19,.65);
ball(g,mat.pink,i*.36,.84,0,.18);
}
scene.add(g);
gardens++;
toast('🌸 A new flower garden!');
stats();save();
}
function build(){
if(wood<3){toast('🪵 Gather three logs to build.');return}
const p=characters[selected].model.position;
wood-=3;homes++;
cottage(clamp(p.x+6,-42,42),clamp(p.z+5,-42,42),'#efd4b5');
toast('🏡 A cozy cottage is ready!');
stats();save();
}
function rest(){
time=(time+1)%4;
if(time===0){
night++;
if(night%8===1)season=(season+1)%4;
}
weather=rng()<.24?(season===3?3:1):rng()<.2?2:0;
ambience();stats();save();
toast(night>=99?'🏆 You reached 99 nights! Keep exploring!':'✨ '+timeNames[time]+' in '+seasonNames[season]);
}

function panel(title,html){
$('screenTitle').textContent=title;
$('screenBody').innerHTML=html;
$('screen').style.display='flex';
paused=true;
}
function closePanel(){
$('screen').style.display='none';
paused=false;
}
$('close').onclick=closePanel;

function characterList(){
panel('🐾 Your Characters',
'<p>Everyone else continues living independently.</p>'+
party.map((s,i)=>`<div class="entry"><span>${i===selected?'⭐ ':''}${s.name} · ${s.kind}</span><button data-i="${i}">Play</button></div>`).join('')+
'<button id="create">✨ Make a Character</button>');
$('screenBody').querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{
switchTo(+el.dataset.i);closePanel();
});
$('create').onclick=characterCreator;
}
function characterCreator(){
panel('✨ Create a Friend',`
<label>Name<input id="newName" maxlength="18" value="Clover"></label>
<label>Character<select id="newKind">
<option value="cat">Kitten</option>
<option value="dog">Puppy</option>
<option value="bird">Bird</option>
<option value="person">Person</option>
</select></label>
<label>Fur or hair<select id="newColor">
<option value="#eab374">Golden</option>
<option value="#eee6d9">Snow</option>
<option value="#96765e">Chocolate</option>
<option value="#b6a4d6">Lavender</option>
<option value="#9ecad6">Blue</option>
</select></label>
<button id="makeNow">Create</button>`);
$('makeNow').onclick=()=>{
if(party.length>=12){toast('Maximum 12 playable characters.');closePanel();return}
const p=characters[selected].model.position;
const s={
name:$('newName').value.trim()||'Friend',
kind:$('newKind').value,
color:$('newColor').value,
accent:'#f6e4cc',outfit:'#b5a2d8',x:p.x+2,z:p.z+1
};
party.push(s);
characters.push(agent(s,true));
switchTo(party.length-1);
closePanel();
};
}
$('characters').onclick=characterList;
$('inventory').onclick=()=>{
panel('🎒 Keepsakes & Supplies',`
<p>${inventory.length?inventory.join(' · '):'Search for glowing artifacts around the forest!'}</p>
<p>🪵 ${wood} wood · 🍓 ${berries} berries · 🌷 ${gardens} gardens · 🏡 ${homes} cottages</p>
<button id="plantNow">🌷 Plant flowers</button>
<button id="buildNow">🏡 Build cottage (3 wood)</button>`);
$('plantNow').onclick=()=>{plant();closePanel()};
$('buildNow').onclick=()=>{build();closePanel()};
};
$('menu').onclick=()=>{
panel('📖 Village Guide',`
<p>Use the left circle to move. Use the right circle or drag the background to rotate the camera. Pinch to zoom.</p>
<p>Tap 🐾 to switch characters or create a new kitten, puppy, bird or person. Other characters wander independently.</p>
<p>Explore for artifacts and wood. Plant flowers, build cottages, and rest to change the time of day.</p>
<button id="musicButton">🎵 ${music?'Music On':'Music Off'}</button>`);
$('musicButton').onclick=()=>{
music=!music;
$('musicButton').textContent='🎵 '+(music?'Music On':'Music Off');
if(music)startAudio();
};
};
$('action').onclick=explore;
$('sleep').onclick=rest;
$('start').onclick=()=>{
$('intro').style.display='none';
playing=true;
toast('🍁 Welcome to Bloomwood Valley!');
};

function joystick(id){
const el=$(id),nub=el.querySelector('.nub'),state={x:0,y:0};
function update(e){
e.preventDefault();
const r=el.getBoundingClientRect();
const dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
const l=Math.hypot(dx,dy)||1,k=Math.min(37,l);
state.x=dx/l*k/37;state.y=dy/l*k/37;
nub.style.transform=`translate(${state.x*37}px,${state.y*37}px)`;
}
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);update(e)});
el.addEventListener('pointermove',e=>{if(el.hasPointerCapture(e.pointerId))update(e)});
function reset(){state.x=state.y=0;nub.style.transform='translate(0,0)'}
el.addEventListener('pointerup',reset);
el.addEventListener('pointercancel',reset);
return state;
}
const move=joystick('move'),look=joystick('cameraStick');
let yaw=.55,pitch=.52,distance=13.5,drag=null,pinchDistance=0;
const pointers=new Map();
renderer.domElement.addEventListener('pointerdown',e=>{
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pointers.size===1)drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
});
renderer.domElement.addEventListener('pointermove',e=>{
if(!pointers.has(e.pointerId))return;
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pointers.size===2){
const p=[...pointers.values()];
const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
if(pinchDistance)distance=clamp(distance+(pinchDistance-d)*.035,7,23);
pinchDistance=d;drag=null;return;
}
if(drag){
const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
yaw-=dx*.006;pitch=clamp(pitch+dy*.004,.22,1.1);
drag.x=e.clientX;drag.y=e.clientY;
}
});
const ray=new T.Raycaster(),pointer=new T.Vector2();
renderer.domElement.addEventListener('pointerup',e=>{
pointers.delete(e.pointerId);pinchDistance=0;
if(drag&&!drag.moved&&performance.now()-drag.t<250&&playing&&!paused){
pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);
ray.setFromCamera(pointer,camera);
const hit=ray.intersectObjects(characters.map(a=>a.model),true);
if(hit.length){
let obj=hit[0].object;
while(obj.parent&&!characters.some(a=>a.model===obj))obj=obj.parent;
const i=characters.findIndex(a=>a.model===obj);
if(i>=0)switchTo(i);
}
}
drag=null;
});
renderer.domElement.addEventListener('pointercancel',e=>{
pointers.delete(e.pointerId);drag=null;pinchDistance=0;
});

const stops=[[0,0],[17,3],[-19,9],[-10,-9],[10,-9],[-10,11],[10,11],[-5,-12],[5,12]];
function newGoal(a,nighttime){
const p=nighttime&&rng()<.75?[a.home.x,a.home.z]:pick(stops);
a.goal.set(p[0]+rand(-2.2,2.2),0,p[1]+rand(-2.2,2.2));
a.pause=rand(.7,3);
}
function animateGait(a,t,i,moving){
const ud=a.model.userData,v=moving?1:0;
ud.rig.position.y=Math.sin(t*.012+i)*.055*v;
ud.head.rotation.z=Math.sin(t*.006+i)*.045;
ud.legs.forEach((l,k)=>l.rotation.x=Math.sin(t*.012+i+k*Math.PI)*.35*v);
ud.arms.forEach((l,k)=>l.rotation.x=Math.sin(t*.012+i+(1-k)*Math.PI)*.18*v);
ud.tail.rotation.y=Math.sin(t*.006+i)*.35;
}
function animateAgent(a,dt,t,i,nighttime){
const root=a.model,rig=root.userData.rig;
if(a.pause>0){
a.pause-=dt;
rig.position.y=Math.sin(t*.003+i)*.015;
root.userData.head.rotation.z=Math.sin(t*.002+i)*.045;
return;
}
const d=a.goal.clone().sub(root.position);
d.y=0;
if(d.lengthSq()<.55){newGoal(a,nighttime);return}
d.normalize();
const speed=nighttime?.7:1.12;
root.position.addScaledVector(d,speed*dt);
root.position.x=clamp(root.position.x,-45,45);
root.position.z=clamp(root.position.z,-45,45);
root.rotation.y=Math.atan2(d.x,d.z);
animateGait(a,t,i,true);
}

const precipitation=[],particleMat=new T.MeshBasicMaterial({color:'#e9f6ff'});
for(let i=0;i<65;i++){
precipitation.push(ball(scene,particleMat,0,-100,0,.045,.13,.045));
}

let audio,noteIndex=0;
const notes=[392,440,523,587,659,523,440,392];
function startAudio(){
try{
audio??=new(window.AudioContext||window.webkitAudioContext)();
audio.resume();
}catch(e){}
}
setInterval(()=>{
if(!music||!playing)return;
try{
startAudio();if(!audio)return;
const o=audio.createOscillator(),v=audio.createGain();
o.type='sine';o.frequency.value=notes[noteIndex++%notes.length];
v.gain.setValueAtTime(.025,audio.currentTime);
v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.27);
o.connect(v);v.connect(audio.destination);
o.start();o.stop(audio.currentTime+.28);
}catch(e){}
},410);

let last=performance.now(),elapsed=0;
const velocity=new T.Vector3(),focus=new T.Vector3();
camera.position.set(8,9,14);

function frame(t){
requestAnimationFrame(frame);
const dt=Math.min((t-last)/1000,.05);
last=t;

if(playing&&!paused){
const hero=characters[selected],p=hero.model.position;
yaw-=look.x*1.55*dt;
pitch=clamp(pitch+look.y*.8*dt,.22,1.1);
const intensity=Math.hypot(move.x,move.y);

if(intensity>.085){
const forward=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
const right=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
velocity.copy(right).multiplyScalar(move.x).addScaledVector(forward,-move.y).normalize();
const old=p.clone();
p.addScaledVector(velocity,dt*4.4);
p.x=clamp(p.x,-46,46);
p.z=clamp(p.z,-46,46);
for(const o of obstacles){
if(Math.hypot(p.x-o.x,p.z-o.z)<o.r){p.copy(old);break}
}
hero.model.rotation.y=Math.atan2(velocity.x,velocity.z);
animateGait(hero,t,0,true);
}else animateGait(hero,t,0,false);

for(let i=0;i<characters.length;i++)
if(i!==selected)animateAgent(characters[i],dt,t,i,time===3);
for(let i=0;i<villagers.length;i++)
animateAgent(villagers[i],dt,t,i+30,time===3);

focus.set(p.x,1.2,p.z);
const target=new T.Vector3(
p.x+Math.sin(yaw)*distance*Math.cos(pitch),
1.2+distance*Math.sin(pitch),
p.z+Math.cos(yaw)*distance*Math.cos(pitch)
);
for(const o of obstacles){
const dx=target.x-o.x,dz=target.z-o.z;
if(Math.hypot(dx,dz)<o.r+1.3&&target.y<5.5)target.y=5.5;
}
camera.position.lerp(target,Math.min(1,dt*5));
camera.lookAt(focus);
elapsed+=dt;
if(elapsed>105){elapsed=0;rest()}
}

for(const [c,ph] of wind)c.rotation.z=Math.sin(t*.0008+ph)*.025;
for(let i=0;i<treasures.length;i++){
const a=treasures[i];
if(!a.found){
a.g.rotation.y+=dt*.7;
a.g.position.y=Math.sin(t*.002+i)*.09;
}
}
for(const p of precipitation){
p.visible=weather===1||weather===3;
if(!p.visible)continue;
const h=characters[selected].model.position;
if(p.position.y<0)
p.position.set(h.x+rand(-15,15),rand(7,18),h.z+rand(-15,15));
p.position.y-=dt*(weather===3?1.5:10);
p.position.x+=dt*(weather===3?.5:2);
}
renderer.render(scene,camera);
}
requestAnimationFrame(frame);

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
